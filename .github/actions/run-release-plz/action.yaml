name: run-release-plz
description: Mint a GitHub App token, set up Rust, and run release-plz with the given subcommand. Caller must run actions/checkout first.
inputs:
  command:
    description: release-plz subcommand, e.g. release-pr or release.
    required: true
  app-id:
    description: GitHub App client id. Must be supplied from secrets.* so runtime masking applies.
    required: true
  app-private-key:
    description: GitHub App private key. Must be supplied from secrets.* so runtime masking applies.
    required: true
runs:
  using: composite
  steps:
    - uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
      id: app-token
      with:
        client-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.app-private-key }}
        # release-plz needs contents:write (push branches/tags) and
        # pull-requests:write (open release PRs). Scoping the token down
        # avoids zizmor's github-app finding and follows least-privilege.
        permission-contents: write
        permission-pull-requests: write
    - name: Install Rust toolchain
      shell: bash
      run: |
        set -euo pipefail
        rustup toolchain install stable --profile minimal --no-self-update
        rustup show active-toolchain
        cargo --version
        rustc --version
    - uses: release-plz/action@1528104d2ca23787631a1c1f022abb64b34c1e11 # v0.5.128
      with:
        command: ${{ inputs.command }}
      env:
        GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
