name: Release (dry-run)

# Mirrors release.yaml's build + publish-crate jobs without performing
# the irreversible side effects (real GitHub release publication, real
# cargo publish to crates.io).
# The goal is to let a PR exercise the entire release pipeline so any
# breakage surfaces before a tag is cut. Path filters keep PRs that
# cannot affect release output (docs-only, unrelated tooling) cheap.

on:
  pull_request:
    # Trigger on PRs that touch anything the release pipeline consumes.
    # Two distinct categories live in this list:
    #   1. Build-pipeline inputs — release.yaml/setup-nix-devshell/flake/
    #      justfile/Cargo/src/web. A change here can break the build itself.
    #   2. cargo publish tarball inputs (mirror Cargo.toml `include`) —
    #      README/LICENSE/CHANGELOG/rust-toolchain.toml. Deleting or renaming
    #      these silently breaks `cargo publish --dry-run` at tag cut.
    # Updating Cargo.toml `include` should be matched by updating this list,
    # but the converse isn't required (build-pipeline files have no `include`).
    paths:
      - '.github/workflows/release.yaml'
      - '.github/workflows/release-dryrun.yaml'
      - '.github/actions/setup-nix-devshell/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'flake.nix'
      - 'flake.lock'
      - 'justfile'
      - 'rust-toolchain.toml'
      - 'README.md'
      - 'LICENSE'
      - 'CHANGELOG.md'
      - 'web/**'
      - 'src/**'
  workflow_dispatch:

concurrency:
  group: release-dryrun-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Skip on fork PRs: this workflow shares Nix store cache keys with
    # release.yaml (cache warming intent). A fork PR could otherwise
    # poison the cache via malicious source files and have that cache
    # picked up by the production release build later.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            asset: linux-amd64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            asset: linux-arm64
          - target: x86_64-apple-darwin
            runner: macos-26-intel
            asset: darwin-amd64
          - target: aarch64-apple-darwin
            runner: macos-latest
            asset: darwin-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - uses: ./.github/actions/setup-nix-devshell
        with:
          # Share the cache key with release.yaml so a successful dry-run
          # warms the cache that the actual release will consume.
          cache-key-prefix: nix-release-${{ matrix.target }}
      - name: Build frontend bundle (web/dist via Nix shell)
        # rust-embed in src/cli/render/browse.rs embeds web/dist/ at build
        # time; without this step the released binary serves an empty bundle.
        # Frontend tooling (pnpm + Node) is pinned via flake.lock — the SSOT
        # for the project's Node/pnpm version pair.
        run: nix develop --command just frontend
      - name: Validate runner architecture
        env:
          RAVELACT_RELEASE_ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          rustc -vV
          uname -a
          arch="$(uname -m)"
          case "${RAVELACT_RELEASE_ASSET}:${arch}" in
            linux-amd64:x86_64|linux-arm64:aarch64|darwin-amd64:x86_64|darwin-arm64:arm64)
              ;;
            *)
              echo "::error::runner architecture ${arch} does not match release asset ${RAVELACT_RELEASE_ASSET}"
              exit 1
              ;;
          esac
      - name: Assert host cargo (not Nix shadow)
        # Guard against PATH ordering surprises: cargo build MUST run with the
        # host rustup toolchain so the released binary does not link against
        # /nix/store paths (later checked by readelf -l + ldd).
        run: |
          set -euo pipefail
          cargo_path="$(command -v cargo)"
          echo "cargo: $cargo_path"
          if printf '%s' "$cargo_path" | grep -F '/nix/store' >/dev/null; then
            echo "::error::cargo is shadowed by Nix (resolved to $cargo_path); host rustup expected"
            exit 1
          fi
      - name: cargo build release
        run: cargo build --release --locked
      - name: stage binary
        run: |
          set -euo pipefail
          mkdir -p staging
          cp target/release/ravelact staging/ravelact-${{ matrix.asset }}
      - name: Validate staged binary
        env:
          RAVELACT_RELEASE_ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          bin="staging/ravelact-${RAVELACT_RELEASE_ASSET}"
          "$bin" --version

          if [[ "$RAVELACT_RELEASE_ASSET" == linux-* ]]; then
            file "$bin"
            readelf -l "$bin" | tee staging/readelf.txt
            if grep -F '/nix/store' staging/readelf.txt; then
              echo "::error::Linux release asset references /nix/store in ELF program headers"
              exit 1
            fi
            ldd "$bin" | tee staging/ldd.txt
            if grep -F '/nix/store' staging/ldd.txt; then
              echo "::error::Linux release asset references /nix/store in dynamic dependencies"
              exit 1
            fi
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ravelact-${{ matrix.asset }}-dryrun
          path: staging/ravelact-${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 1

  publish-crate-dryrun:
    # `needs: build` mirrors release.yaml's publish-crate sequencing so the
    # dry-run gates on matrix build success first. The build artifacts are
    # NOT consumed here — publish-crate-dryrun checks out fresh and runs
    # `cargo publish --dry-run` standalone. The dependency exists purely to
    # fail fast if any matrix target broke before paying the dry-run cost.
    needs: build
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-nix-devshell
        with:
          cache-key-prefix: nix-publish-crate-${{ runner.os }}
      - name: Build frontend bundle
        run: nix develop --command just frontend
      - name: cargo package (verify tarball builds)
        # `cargo package` (with default --verify) performs the same
        # Packaging + Verifying steps that `cargo publish` would run before
        # upload — without needing crates.io auth and without bailing early
        # when the current version already exists on the registry (which
        # would make `cargo publish --dry-run` a no-op).
        # `--allow-dirty` is required because `just frontend` generates
        # web/dist/ and web/node_modules/ on the runner, both .gitignored.
        # The packaged tarball is filtered via Cargo.toml `include`, so
        # dirty-tree contents do not leak into the .crate file.
        run: nix develop --command cargo package --locked --allow-dirty
      - name: Assert tarball ships required runtime files
        # Verify the tarball listing contains every file the released
        # binary needs at runtime. The cargo `include` whitelist drives
        # what ships; this guards against future regressions where a
        # required path is silently dropped from include.
        #
        # NOTE: avoid `printf | head` pipelines here — under
        # `set -o pipefail` printf gets SIGPIPE when head exits early,
        # which `set -e` then treats as a script failure. Write listing
        # to a file and operate on the file instead.
        run: |
          set -euo pipefail
          tarball="$(find target/package -maxdepth 1 -name 'ravelact-*.crate' -print -quit)"
          if [ -z "$tarball" ]; then
            echo "::error::no tarball found under target/package"
            ls -la target/package/ || true
            exit 1
          fi
          listing_file="$(mktemp)"
          tar -tzf "$tarball" > "$listing_file"
          echo "tarball: $tarball ($(wc -l < "$listing_file") entries)"
          required=(
            "web/dist/index.html"
            "web/dist/assets"
            "rust-toolchain.toml"
            "Cargo.lock"
            "README.md"
            "LICENSE"
          )
          missing=()
          for f in "${required[@]}"; do
            if ! grep -qF "/$f" "$listing_file"; then
              missing+=("$f")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::tarball is missing required files: ${missing[*]}"
            echo "--- entries matching 'web/' ---"
            grep -F 'web/' "$listing_file" | head -10 || true
            exit 1
          fi
          echo "all required files present in tarball"
