name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            asset: linux-amd64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            asset: linux-arm64
          - target: x86_64-apple-darwin
            runner: macos-26-intel
            asset: darwin-amd64
          - target: aarch64-apple-darwin
            runner: macos-latest
            asset: darwin-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - uses: ./.github/actions/setup-nix-devshell
        with:
          cache-key-prefix: nix-release-${{ matrix.target }}
      - name: Build frontend bundle (web/dist via Nix shell)
        # rust-embed in src/cli/render/browse.rs embeds web/dist/ at build
        # time; without this step the released binary serves an empty bundle.
        # Frontend tooling (pnpm + Node) is pinned via flake.lock — the SSOT
        # for the project's Node/pnpm version pair.
        run: nix develop --command just frontend
      - name: Validate runner architecture
        env:
          RAVELACT_RELEASE_ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          rustc -vV
          uname -a
          arch="$(uname -m)"
          case "${RAVELACT_RELEASE_ASSET}:${arch}" in
            linux-amd64:x86_64|linux-arm64:aarch64|darwin-amd64:x86_64|darwin-arm64:arm64)
              ;;
            *)
              echo "::error::runner architecture ${arch} does not match release asset ${RAVELACT_RELEASE_ASSET}"
              exit 1
              ;;
          esac
      - name: Assert host cargo (not Nix shadow)
        # Guard against PATH ordering surprises: cargo build MUST run with the
        # host rustup toolchain so the released binary does not link against
        # /nix/store paths (later checked by readelf -l + ldd).
        run: |
          set -euo pipefail
          cargo_path="$(command -v cargo)"
          echo "cargo: $cargo_path"
          if printf '%s' "$cargo_path" | grep -F '/nix/store' >/dev/null; then
            echo "::error::cargo is shadowed by Nix (resolved to $cargo_path); host rustup expected"
            exit 1
          fi
      - name: cargo build release
        run: cargo build --release --locked
      - name: stage binary
        run: |
          set -euo pipefail
          mkdir -p staging
          cp target/release/ravelact staging/ravelact-${{ matrix.asset }}
      - name: Validate staged binary
        env:
          RAVELACT_RELEASE_ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          bin="staging/ravelact-${RAVELACT_RELEASE_ASSET}"
          "$bin" --version

          if [[ "$RAVELACT_RELEASE_ASSET" == linux-* ]]; then
            file "$bin"
            readelf -l "$bin" | tee staging/readelf.txt
            if grep -F '/nix/store' staging/readelf.txt; then
              echo "::error::Linux release asset references /nix/store in ELF program headers"
              exit 1
            fi
            ldd "$bin" | tee staging/ldd.txt
            if grep -F '/nix/store' staging/ldd.txt; then
              echo "::error::Linux release asset references /nix/store in dynamic dependencies"
              exit 1
            fi
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ravelact-${{ matrix.asset }}
          path: staging/ravelact-${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 1

  publish-crate:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix-devshell
        with:
          cache-key-prefix: nix-publish-crate-${{ runner.os }}
      - name: Build frontend bundle
        # Required before `cargo publish` so the resulting tarball includes
        # web/dist/ (whitelisted via Cargo.toml `include`); otherwise the
        # crates.io tarball ships an empty rust-embed bundle and the
        # browse subcommand serves a blank SPA to `cargo install` users.
        run: nix develop --command just frontend
      - name: Preflight crate publish
        id: publish-preflight
        run: |
          set -euo pipefail

          read -r crate_name crate_version < <(
            nix develop --command bash -c \
              'set -euo pipefail; cargo metadata --no-deps --format-version 1 | jq -r ".packages[0] | [.name, .version] | @tsv"'
          )

          expected_tag="v${crate_version}"
          if [ "$GITHUB_REF_NAME" != "$expected_tag" ]; then
            echo "::error::release tag $GITHUB_REF_NAME does not match Cargo package version $crate_version"
            exit 1
          fi

          status=$(curl --fail-with-body --retry 3 --retry-delay 2 --retry-all-errors -sS -o /tmp/crates-version.json -w '%{http_code}' \
            -H "User-Agent: ravelact-release-ci/${crate_version} (https://github.com/wadackel/ravelact)" \
            "https://crates.io/api/v1/crates/${crate_name}/${crate_version}" || true)

          case "$status" in
            200)
              already_published=true
              ;;
            404)
              already_published=false
              ;;
            *)
              echo "::error::unexpected crates.io API status ${status} for ${crate_name} ${crate_version}"
              exit 1
              ;;
          esac

          {
            echo "crate_name=${crate_name}"
            echo "crate_version=${crate_version}"
            echo "already_published=${already_published}"
          } >> "$GITHUB_OUTPUT"
      - name: Authenticate with crates.io
        if: steps.publish-preflight.outputs.already_published != 'true'
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@bbd81622f20ce9e2dd9622e3218b975523e45bbe # v1.0.4
      - name: Publish crate
        if: steps.publish-preflight.outputs.already_published != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        # `--allow-dirty` is required because `just frontend` (run above)
        # generates web/dist/ and web/node_modules/, both gitignored. The
        # published tarball is whitelist-filtered via Cargo.toml `include`,
        # so dirty-tree contents do not leak into crates.io.
        run: nix develop --command cargo publish --locked --allow-dirty
      - name: Skip already published crate
        if: steps.publish-preflight.outputs.already_published == 'true'
        env:
          CRATE_NAME: ${{ steps.publish-preflight.outputs.crate_name }}
          CRATE_VERSION: ${{ steps.publish-preflight.outputs.crate_version }}
        run: echo "${CRATE_NAME} ${CRATE_VERSION} is already published on crates.io"

  release:
    needs:
      - build
      - publish-crate
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: ravelact-*
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd artifacts
          chmod +x ravelact-*
          shasum -a 256 ravelact-* > checksums.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          existing_release="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
              --jq ".[] | select(.tag_name == env.GITHUB_REF_NAME) | .html_url"
          )"

          if [ -n "${existing_release}" ]; then
            echo "::error::GitHub release ${GITHUB_REF_NAME} already exists: ${existing_release}"
            echo "::error::immutable releases cannot accept assets after publication; create a new tag or resolve the existing draft/release manually"
            exit 1
          fi

          gh release create "$GITHUB_REF_NAME" artifacts/ravelact-* artifacts/checksums.txt \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
