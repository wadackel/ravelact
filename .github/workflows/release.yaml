name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            asset: linux-amd64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            asset: linux-arm64
          - target: x86_64-apple-darwin
            runner: macos-26-intel
            asset: darwin-amd64
          - target: aarch64-apple-darwin
            runner: macos-latest
            asset: darwin-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-nix-devshell
        with:
          cache-key-prefix: nix-release-${{ matrix.target }}
      - name: nix build
        run: nix build .#default --print-build-logs
      - name: stage binary
        run: |
          mkdir -p staging
          cp result/bin/ravelact staging/ravelact-${{ matrix.asset }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ravelact-${{ matrix.asset }}
          path: staging/ravelact-${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: ravelact-*
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd artifacts
          chmod +x ravelact-*
          shasum -a 256 ravelact-* > checksums.txt
      - name: Ensure GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" artifacts/ravelact-* artifacts/checksums.txt --clobber
