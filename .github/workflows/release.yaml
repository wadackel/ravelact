name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Build the SPA bundle once, on Linux, inside the Nix dev shell (the SSOT
  # for the project's Node/pnpm pair). The resulting web/dist/ is Rust-target
  # independent — rust-embed in src/cli/render/browse/mod.rs reads it at
  # compile time regardless of the binary's architecture — so every build
  # matrix entry can reuse this single artifact. Keeping Nix confined to this
  # job lets the per-target builds run on plain rustup, which is required:
  # the Determinate Nix Installer no longer supports Intel macOS hosts.
  frontend-bundle:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix-devshell
        with:
          cache-key-prefix: nix-release-frontend
      - name: Build frontend bundle (web/dist via Nix shell)
        # rust-embed in src/cli/render/browse/mod.rs embeds web/dist/ at build
        # time; without this the released binary serves an empty bundle.
        # Frontend tooling (pnpm + Node) is pinned via flake.lock — the SSOT
        # for the project's Node/pnpm version pair.
        run: nix develop --command just frontend
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-dist
          path: web/dist
          # web/dist/.gitkeep is the rust-embed folder-existence placeholder
          # (see justfile `frontend`); without this flag upload-artifact skips
          # the dotfile and the folder can come back empty on download.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  build:
    needs: frontend-bundle
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            asset: linux-amd64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            asset: linux-arm64
          # darwin-amd64 is cross-compiled from an Apple Silicon runner:
          # GitHub-hosted Intel macOS runners can no longer install Nix
          # (Determinate dropped Intel host support), and x86_64 macOS
          # runners are slated for removal by GitHub in 2027-08. The host
          # toolchain only needs `rustup target add x86_64-apple-darwin`.
          # This cross-build needs no extra linker config only because the
          # dependency tree is pure Rust (no `*-sys` / ring / openssl, no
          # build.rs). Re-evaluate this job if a C-linking crate is added.
          - target: x86_64-apple-darwin
            runner: macos-latest
            asset: darwin-amd64
          - target: aarch64-apple-darwin
            runner: macos-latest
            asset: darwin-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        # `stable` matches rust-toolchain.toml's channel. That file also lists
        # rustfmt/clippy/llvm-tools-preview components, which rustup auto-fetches
        # on the first cargo invocation below — none are needed to build, so we
        # install the minimal profile and let the (small) component fetch happen
        # lazily rather than widening the profile here.
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup target add ${{ matrix.target }}
      - name: Restore frontend bundle (web/dist)
        # rust-embed embeds web/dist/ at compile time; download the bundle
        # produced once by the frontend-bundle job instead of rebuilding it
        # per target. The binary itself is built with the host rustup
        # toolchain (no Nix), so it does not link against /nix/store paths.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-dist
          path: web/dist
      - name: cargo build release
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: stage binary
        run: |
          set -euo pipefail
          mkdir -p staging
          cp target/${{ matrix.target }}/release/ravelact staging/ravelact-${{ matrix.asset }}
      - name: Validate staged binary
        env:
          RAVELACT_RELEASE_ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          bin="staging/ravelact-${RAVELACT_RELEASE_ASSET}"
          file "$bin"

          # Assert the produced binary's architecture matches the asset name.
          # This is the cross-build safety net: darwin-amd64 is built on an
          # arm64 runner, so `file` (not `uname -m`) is the source of truth.
          # The expected token tracks the `file` flavour per OS: GNU file on
          # Linux prints `x86-64` (hyphen); BSD file on macOS prints `x86_64`
          # (underscore). Do not "normalize" these — the grep depends on them.
          case "$RAVELACT_RELEASE_ASSET" in
            linux-amd64) expect='x86-64' ;;
            linux-arm64) expect='aarch64' ;;
            darwin-amd64) expect='x86_64' ;;
            darwin-arm64) expect='arm64' ;;
            *)
              echo "::error::unknown release asset ${RAVELACT_RELEASE_ASSET}"
              exit 1
              ;;
          esac
          if ! file "$bin" | grep -F "$expect" >/dev/null; then
            echo "::error::${RAVELACT_RELEASE_ASSET} is not a ${expect} binary"
            exit 1
          fi

          # Smoke-test --version only when the runner can execute the binary
          # natively. The cross-built darwin-amd64 asset runs on an arm64
          # runner, so skip its execution to avoid depending on Rosetta.
          arch="$(uname -m)"
          case "${RAVELACT_RELEASE_ASSET}:${arch}" in
            linux-amd64:x86_64|linux-arm64:aarch64|darwin-amd64:x86_64|darwin-arm64:arm64)
              "$bin" --version
              ;;
            *)
              echo "skipping --version smoke test: ${RAVELACT_RELEASE_ASSET} not natively runnable on ${arch}"
              ;;
          esac
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ravelact-${{ matrix.asset }}
          path: staging/ravelact-${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 1

  publish-crate:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix-devshell
        with:
          cache-key-prefix: nix-publish-crate-${{ runner.os }}
      - name: Build frontend bundle
        # Required before `cargo publish` so the resulting tarball includes
        # web/dist/ (whitelisted via Cargo.toml `include`); otherwise the
        # crates.io tarball ships an empty rust-embed bundle and the
        # browse subcommand serves a blank SPA to `cargo install` users.
        run: nix develop --command just frontend
      - name: Preflight crate publish
        id: publish-preflight
        run: |
          set -euo pipefail

          read -r crate_name crate_version < <(
            nix develop --command bash -c \
              'set -euo pipefail; cargo metadata --no-deps --format-version 1 | jq -r ".packages[0] | [.name, .version] | @tsv"'
          )

          expected_tag="v${crate_version}"
          if [ "$GITHUB_REF_NAME" != "$expected_tag" ]; then
            echo "::error::release tag $GITHUB_REF_NAME does not match Cargo package version $crate_version"
            exit 1
          fi

          status=$(curl --fail-with-body --retry 3 --retry-delay 2 --retry-all-errors -sS -o /tmp/crates-version.json -w '%{http_code}' \
            -H "User-Agent: ravelact-release-ci/${crate_version} (https://github.com/wadackel/ravelact)" \
            "https://crates.io/api/v1/crates/${crate_name}/${crate_version}" || true)

          case "$status" in
            200)
              already_published=true
              ;;
            404)
              already_published=false
              ;;
            *)
              echo "::error::unexpected crates.io API status ${status} for ${crate_name} ${crate_version}"
              exit 1
              ;;
          esac

          {
            echo "crate_name=${crate_name}"
            echo "crate_version=${crate_version}"
            echo "already_published=${already_published}"
          } >> "$GITHUB_OUTPUT"
      - name: Authenticate with crates.io
        if: steps.publish-preflight.outputs.already_published != 'true'
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@bbd81622f20ce9e2dd9622e3218b975523e45bbe # v1.0.4
      - name: Publish crate
        if: steps.publish-preflight.outputs.already_published != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        # `--allow-dirty` is required because `just frontend` (run above)
        # generates web/dist/ and web/node_modules/, both gitignored. The
        # published tarball is whitelist-filtered via Cargo.toml `include`,
        # so dirty-tree contents do not leak into crates.io.
        run: nix develop --command cargo publish --locked --allow-dirty
      - name: Skip already published crate
        if: steps.publish-preflight.outputs.already_published == 'true'
        env:
          CRATE_NAME: ${{ steps.publish-preflight.outputs.crate_name }}
          CRATE_VERSION: ${{ steps.publish-preflight.outputs.crate_version }}
        run: echo "${CRATE_NAME} ${CRATE_VERSION} is already published on crates.io"

  release:
    needs:
      - build
      - publish-crate
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: ravelact-*
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd artifacts
          chmod +x ravelact-*
          shasum -a 256 ravelact-* > checksums.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          existing_release="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
              --jq ".[] | select(.tag_name == env.GITHUB_REF_NAME) | .html_url"
          )"

          if [ -n "${existing_release}" ]; then
            echo "::error::GitHub release ${GITHUB_REF_NAME} already exists: ${existing_release}"
            echo "::error::immutable releases cannot accept assets after publication; create a new tag or resolve the existing draft/release manually"
            exit 1
          fi

          gh release create "$GITHUB_REF_NAME" artifacts/ravelact-* artifacts/checksums.txt \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
