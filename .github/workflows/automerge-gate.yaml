name: automerge-gate

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - auto_merge_enabled

permissions:
  contents: read
  checks: read
  pull-requests: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: automerge-gate/all-passed
    runs-on: ubuntu-latest
    # Must exceed the longest sibling job's timeout (coverage: 30) so the
    # aggregator does not fail on its own job timeout while polling.
    timeout-minutes: 35
    steps:
      - uses: pkgdeps/automerge-gate@9ab7a1d211aca48667cdbf94cca05ae67b64eba2 # v5.0.5
        with:
          gate-mode: 'public'
