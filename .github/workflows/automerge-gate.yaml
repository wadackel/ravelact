name: automerge-gate

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - auto_merge_enabled

permissions:
  contents: read
  checks: read
  pull-requests: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: automerge-gate/all-passed
    runs-on: ubuntu-latest
    # Must exceed the longest sibling job's timeout (coverage: 30) so the
    # aggregator does not fail on its own job timeout while polling.
    timeout-minutes: 35
    steps:
      - uses: pkgdeps/automerge-gate@fe5d7cd2fc17778dc42f6916f9d9990cb259ad01 # v5.0.0
        with:
          gate-mode: 'public'
