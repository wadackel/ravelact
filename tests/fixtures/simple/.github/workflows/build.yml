name: Build
on:
  workflow_call:
    inputs:
      artifact:
        required: true
        description: artifact name
    outputs:
      url:
        description: published artifact URL
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: echo build ${{ inputs.artifact }}
