name: Update foo
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump
        run: |
          set -euo pipefail
          FOO_VERSION=$(curl -s https://example.com/foo/latest)
          sed -i "s/^FOO=.*/FOO=$FOO_VERSION/" config.env
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: deps/update-foo
          title: "deps: update foo"
