name: Update bar
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump
        run: |
          set -euo pipefail
          BAR_VERSION=$(curl -s https://example.com/bar/latest)
          sed -i "s/^BAR=.*/BAR=$BAR_VERSION/" config.env
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: deps/update-bar
          title: "deps: update bar"
