name: Update cares
on:
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  check-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo check cares
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: deps/update-cares
          title: "deps: update cares"
          body: "Auto-bump for cares"
