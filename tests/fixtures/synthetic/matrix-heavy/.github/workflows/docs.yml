name: Docs
on:
  pull_request:
    paths: [docs/**]
jobs:
  docs:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        node-version: ["20"]
        include:
          - os: ubuntu-latest
            node-version: "22"
            target: preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: docs-${{ matrix.target || 'default' }}
          path: docs/dist
      - run: echo docs
