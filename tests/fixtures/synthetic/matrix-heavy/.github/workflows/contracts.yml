name: Contracts
on:
  pull_request:
    branches: [main]
jobs:
  contracts:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: ["20", "22"]
        suite: [api, db]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: echo contracts ${{ matrix.suite }}
