name: CI
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Greet committer
        run: echo "Building for ${{ github.event.head_commit.author.name }}"
      - name: Run third-party action
        uses: some-org/some-action@v1
